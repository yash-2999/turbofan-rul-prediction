<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="System architecture of the turbofan RUL prediction system" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f1f5f9}
    .h{font-size:16px;font-weight:700}
    .s{font-size:13px;fill:#cbd5e1}
    .m{font-size:12px;fill:#7dd3fc;font-family:Consolas,Menlo,monospace}
    .box{fill:#1e293b;stroke-width:2}
    .ln{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>

  <rect width="1200" height="640" fill="#0f172a"/>
  <text x="40" y="50" class="t" font-size="26" font-weight="700">System Architecture</text>
  <text x="40" y="74" class="t s">NASA FD001 data → preprocessing → Gradient Boosting model → evaluation → saved model → Flask API → React dashboard</text>

  <!-- Row A: ML pipeline -->
  <rect class="box" x="40" y="100" width="250" height="90" rx="12" stroke="#38bdf8"/>
  <text x="58" y="127" class="t h">NASA C-MAPSS FD001</text>
  <text x="58" y="148" class="m">backend/data/raw/</text>
  <text x="58" y="168" class="t s">train · test · RUL files</text>

  <rect class="box" x="330" y="100" width="250" height="90" rx="12" stroke="#38bdf8"/>
  <text x="348" y="127" class="t h">Data loading</text>
  <text x="348" y="148" class="m">data_loader.py</text>
  <text x="348" y="168" class="t s">Load engine sensor data</text>

  <rect class="box" x="620" y="100" width="250" height="90" rx="12" stroke="#a78bfa"/>
  <text x="638" y="127" class="t h">Preprocessing</text>
  <text x="638" y="148" class="m">backend/app/ml/</text>
  <text x="638" y="168" class="t s">Feature engineering</text>

  <rect class="box" x="910" y="100" width="250" height="90" rx="12" stroke="#a78bfa"/>
  <text x="928" y="127" class="t h">Model training</text>
  <text x="928" y="148" class="m">python -m app.ml.save_model</text>
  <text x="928" y="168" class="t s">Gradient Boosting Regressor</text>

  <path class="ln" d="M290 145H326"/>
  <path class="ln" d="M580 145H616"/>
  <path class="ln" d="M870 145H906"/>

  <!-- Row B -->
  <rect class="box" x="910" y="250" width="250" height="90" rx="12" stroke="#34d399"/>
  <text x="928" y="277" class="t h">Evaluation</text>
  <text x="928" y="298" class="m">100 test engines</text>
  <text x="928" y="318" class="t s">RMSE · MAE · NASA score</text>

  <rect class="box" x="620" y="250" width="250" height="90" rx="12" stroke="#34d399"/>
  <text x="638" y="277" class="t h">Model artifact</text>
  <text x="638" y="298" class="m">app/models/rul_model.joblib</text>
  <text x="638" y="318" class="t s">Serialized with Joblib · git-ignored</text>

  <rect class="box" x="330" y="250" width="250" height="90" rx="12" stroke="#fbbf24"/>
  <text x="348" y="277" class="t h">Flask REST API</text>
  <text x="348" y="298" class="m">app/routes/api.py</text>
  <text x="348" y="318" class="t s">/api/* · http://127.0.0.1:5000</text>

  <rect class="box" x="40" y="250" width="250" height="90" rx="12" stroke="#64748b" stroke-dasharray="6 5"/>
  <text x="58" y="277" class="t h">Prediction threshold</text>
  <text x="58" y="298" class="m">POST /api/settings/threshold</text>
  <text x="58" y="318" class="t s">Configurable via the API</text>

  <path class="ln" d="M1035 190V246"/>
  <path class="ln" d="M910 295H874"/>
  <path class="ln" d="M620 295H584"/>
  <path class="ln" d="M330 295H294"/>

  <!-- Row C: frontend -->
  <rect class="box" x="40" y="430" width="1120" height="130" rx="14" stroke="#f472b6"/>
  <text x="62" y="460" class="t h">React + TypeScript dashboard</text>
  <text x="62" y="481" class="m">frontend/ · Vite · Recharts · Tailwind CSS · http://localhost:5173</text>
  <g class="t s">
    <text x="62" y="522">1. Dashboard</text>
    <text x="282" y="522">2. Engines</text>
    <text x="502" y="522">3. Predict</text>
    <text x="722" y="522">4. Alerts</text>
    <text x="942" y="522">5. Settings</text>
  </g>

  <path class="ln" d="M455 340V426"/>

  <!-- legend -->
  <g class="t s">
    <rect x="40" y="598" width="12" height="12" rx="3" fill="#38bdf8"/><text x="60" y="609">Data</text>
    <rect x="120" y="598" width="12" height="12" rx="3" fill="#a78bfa"/><text x="140" y="609">Modeling</text>
    <rect x="230" y="598" width="12" height="12" rx="3" fill="#34d399"/><text x="250" y="609">Evaluation</text>
    <rect x="350" y="598" width="12" height="12" rx="3" fill="#fbbf24"/><text x="370" y="609">Backend</text>
    <rect x="450" y="598" width="12" height="12" rx="3" fill="#f472b6"/><text x="470" y="609">Frontend</text>
  </g>
</svg>
