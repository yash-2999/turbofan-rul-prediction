<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Turbofan RUL Prediction System banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f2a43"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- turbofan illustration -->
  <g transform="translate(985 160)">
    <circle r="128" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8"/>
    <circle r="108" fill="#0b1220" fill-opacity="0.55" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3"/>
    <g>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(0)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(30)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(60)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(90)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(120)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(150)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(180)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(210)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(240)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(270)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(300)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      <ellipse cx="0" cy="-52" rx="13" ry="40" transform="rotate(330)" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
      
    </g>
    <circle r="26" fill="#14213d" stroke="#34d399" stroke-width="3"/>
    <circle r="9" fill="#34d399"/>
  </g>

  <!-- title -->
  <rect x="60" y="62" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="120" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Turbofan Remaining Useful Life</text>
  <text x="60" y="170" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="url(#accent)">(RUL) Prediction System</text>
  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cbd5e1">Predictive maintenance on NASA C-MAPSS FD001 · Flask API · React dashboard</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="60" y="250" width="79" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/><text x="99.5" y="270" text-anchor="middle">Python</text>
    <rect x="149" y="250" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/><text x="213.0" y="270" text-anchor="middle">Scikit-learn</text>
    <rect x="287" y="250" width="71" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/><text x="322.5" y="270" text-anchor="middle">Flask</text>
    <rect x="368" y="250" width="71" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/><text x="403.5" y="270" text-anchor="middle">React</text>
    <rect x="449" y="250" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/><text x="505.0" y="270" text-anchor="middle">TypeScript</text>
    
  </g>
</svg>
